<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>ตั้งค่าเพจครั้งแรก</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#F5B544}a:hover{color:#FFD27F}
input::placeholder{color:#8A8178}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #14110F; color: #F4EFE8; font-family: 'IBM Plex Sans Thai', system-ui, sans-serif">
  <div style="height: 844px; overflow-y: auto; padding: 28px 20px 130px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">

    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="font-size: 13px; font-weight: 600; color: #F5B544">ขั้นตอนเดียว ใช้ไม่ถึงนาที</div>
      <h1 style="margin: 0; font-size: 26px; line-height: 1.3; font-weight: 700">ตั้งค่าเพจของคุณ</h1>
      <p style="margin: 0; font-size: 15px; color: #A89F94; line-height: 1.5">ลูกค้าจะเห็นชื่อและรูปนี้ตอนสแกน QR</p>
    </div>

    <div style="display: flex; align-items: center; gap: 16px">
      <div aria-hidden="true" style="width: 80px; height: 80px; border-radius: 50%; background: #1F1B18; border: 2px dashed #5A4F45; display: flex; align-items: center; justify-content: center">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#A89F94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
      </div>
      <button style="height: 44px; padding: 0 16px; border-radius: 999px; background: #1F1B18; border: 1px solid #3A322C; color: #F4EFE8; font: inherit; font-size: 15px; font-weight: 600">เลือกรูป (ไม่บังคับ)</button>
    </div>

    <label style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 15px; font-weight: 600">ชื่อวงหรือชื่อศิลปิน</span>
      <input type="text" value="วงเพื่อนบ้าน" style="height: 50px; padding: 0 14px; border-radius: 14px; background: #1F1B18; border: 1px solid #F5B544; color: #F4EFE8; font: inherit; font-size: 17px; outline: none">
    </label>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span id="pp-label" style="font-size: 15px; font-weight: 600">พร้อมเพย์สำหรับรับทิป</span>
      <div role="group" aria-labelledby="pp-label" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{kinds}}" as="k" hint-placeholder-count="2">
          <button onClick="{{k.pick}}" aria-pressed="{{k.on}}" style="{{k.style}}">{{k.label}}</button>
        </sc-for>
      </div>
      <label style="display: flex; flex-direction: column; gap: 6px">
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">{{kindLabel}}</span>
        <input type="tel" placeholder="{{placeholder}}" style="height: 50px; padding: 0 14px; border-radius: 14px; background: #1F1B18; border: 1px solid #2E2723; color: #F4EFE8; font: inherit; font-size: 17px; outline: none">
      </label>
      <p style="margin: 0; font-size: 13px; color: #A89F94; line-height: 1.5">ลูกค้าจะเห็นแค่ 4 ตัวท้าย เงินโอนเข้าบัญชีคุณโดยตรง แอพไม่ได้แตะเงิน</p>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 20px 30px; background: #1B1714; border-top: 1px solid #2E2723">
    <a href="M-Songs.dc.html" style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 14px; background: #F5B544; color: #1A1408; font-size: 17px; font-weight: 700; text-decoration: none">ถัดไป: ใส่เพลงที่เล่นได้</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { kind: 'phone' };
  }
  renderVals() {
    const base = 'height: 46px; border-radius: 999px; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; ';
    const on = base + 'background: #F5B544; color: #1A1408; border: 1px solid #F5B544';
    const off = base + 'background: #1F1B18; color: #F4EFE8; border: 1px solid #3A322C';
    const opts = [
      { id: 'phone', label: 'เบอร์มือถือ' },
      { id: 'id', label: 'เลขบัตรประชาชน' }
    ];
    const kind = this.state.kind;
    return {
      kinds: opts.map((o) => ({
        label: o.label,
        on: kind === o.id,
        style: kind === o.id ? on : off,
        pick: () => this.setState({ kind: o.id })
      })),
      kindLabel: kind === 'phone' ? 'เบอร์มือถือพร้อมเพย์' : 'เลขบัตรประชาชนพร้อมเพย์',
      placeholder: kind === 'phone' ? '08x-xxx-xxxx' : 'x-xxxx-xxxxx-xx-x'
    };
  }
}
</script>
</body>
</html>
