<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>โอนทิปผ่านพร้อมเพย์</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#F5B544}a:hover{color:#FFD27F}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #14110F; color: #F4EFE8; font-family: 'IBM Plex Sans Thai', system-ui, sans-serif">
  <div style="height: 844px; overflow-y: auto; padding: 16px 20px 170px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">

    <div style="display: flex; align-items: center; gap: 8px">
      <a href="Details.dc.html" aria-label="กลับไปแก้คำขอ" style="width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #1F1B18; border: 1px solid #2E2723">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F4EFE8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
      </a>
      <h1 style="margin: 0; font-size: 22px; font-weight: 700">โอนทิปให้ วงเพื่อนบ้าน</h1>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
      <div style="font-size: 14px; color: #A89F94">ยอดทิป</div>
      <div style="font-size: 44px; font-weight: 700; color: #F5B544; line-height: 1.1">฿50</div>
    </div>

    <div style="background: #FFFFFF; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; color: #14110F; align-self: center">
      <div role="img" aria-label="ตัวอย่าง QR พร้อมเพย์ ยอด 50 บาท" style="width: 236px; height: 236px; display: grid; grid-template-columns: repeat(25, minmax(0, 1fr)); grid-template-rows: repeat(25, minmax(0, 1fr))">
        <sc-for list="{{cells}}" as="c" hint-placeholder-count="625">
          <div style="{{c.style}}"></div>
        </sc-for>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
        <div style="font-size: 15px; font-weight: 600">พร้อมเพย์ · วงเพื่อนบ้าน</div>
        <div style="font-size: 14px; color: #5A524B">เบอร์ xxx-xxx-4821</div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px; background: #1F1B18; border: 1px solid #2E2723; border-radius: 14px; padding: 14px 16px">
      <div style="font-size: 15px; font-weight: 600">วิธีโอน</div>
      <ol style="margin: 0; padding-left: 20px; font-size: 14px; line-height: 1.7; color: #D8CFC4">
        <li>กด "บันทึกรูป QR"</li>
        <li>เปิดแอพธนาคาร แล้วเลือกสแกนจากรูปภาพ</li>
        <li>ยอดเงินกรอกไว้ให้แล้ว กดยืนยันได้เลย</li>
      </ol>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 20px 30px; background: #1B1714; border-top: 1px solid #2E2723; display: flex; flex-direction: column; gap: 10px">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <button style="height: 52px; border-radius: 14px; background: #1F1B18; color: #F4EFE8; border: 1px solid #3A322C; font: inherit; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F4EFE8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg>
        บันทึกรูป QR
      </button>
      <a href="Status.dc.html" style="height: 52px; border-radius: 14px; background: #F5B544; color: #1A1408; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">โอนแล้ว</a>
    </div>
    <a href="Status.dc.html" style="align-self: center; font-size: 14px; padding: 6px 10px">ข้าม ส่งคำขอโดยไม่โอน</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const n = 25;
    const finder = (r, c, r0, c0) => {
      const y = r - r0, x = c - c0;
      if (y < 0 || x < 0 || y > 6 || x > 6) return null;
      if (y === 0 || y === 6 || x === 0 || x === 6) return true;
      if (y >= 2 && y <= 4 && x >= 2 && x <= 4) return true;
      return false;
    };
    const near = (r, c, r0, c0) => r >= r0 - 1 && r <= r0 + 7 && c >= c0 - 1 && c <= c0 + 7;
    let seed = 7;
    const rnd = () => { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; };
    const cells = [];
    for (let r = 0; r < n; r++) {
      for (let c = 0; c < n; c++) {
        let on = finder(r, c, 0, 0);
        if (on === null) on = finder(r, c, 0, n - 7);
        if (on === null) on = finder(r, c, n - 7, 0);
        if (on === null) {
          if (near(r, c, 0, 0) || near(r, c, 0, n - 7) || near(r, c, n - 7, 0)) on = false;
          else on = rnd() > 0.52;
        }
        cells.push({ style: on ? 'background: #14110F' : 'background: transparent' });
      }
    }
    return { cells };
  }
}
</script>
</body>
</html>
