<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>ยังไม่เปิดรับขอเพลง</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#F5B544}a:hover{color:#FFD27F}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #14110F; color: #F4EFE8; font-family: 'IBM Plex Sans Thai', system-ui, sans-serif">
  <div style="height: 844px; overflow-y: auto; padding: 20px 20px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">

    <div style="display: flex; justify-content: flex-end">
      <button style="background: transparent; border: 1px solid #3A322C; color: #C9C0B5; border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13px; min-height: 32px">TH · EN</button>
    </div>

    <div style="display: flex; align-items: center; gap: 14px">
      <div aria-hidden="true" style="width: 60px; height: 60px; border-radius: 50%; background: #2B2420; border: 2px solid #5A4F45; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; color: #A89F94">พบ</div>
      <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
        <h1 style="margin: 0; font-size: 24px; line-height: 1.2; font-weight: 700">วงเพื่อนบ้าน</h1>
        <div style="display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; background: #26211D; color: #C9C0B5; border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 600">
          <span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: #7A7068"></span>
          ปิดรับขอเพลงชั่วคราว
        </div>
      </div>
    </div>

    <div style="display: flex; gap: 12px; align-items: flex-start; background: #1F1B18; border: 1px solid #2E2723; border-radius: 14px; padding: 16px">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F5B544" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <div style="font-size: 16px; font-weight: 600">นักดนตรีปิดรับขอเพลงไว้ชั่วคราว</div>
        <div style="font-size: 14px; color: #A89F94; line-height: 1.5">ดูรายการเพลงไว้ก่อนได้ ลองกลับมาขอใหม่อีกครั้งนะ</div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column">
      <sc-for list="{{songs}}" as="s" hint-placeholder-count="10">
        <div style="display: flex; flex-direction: column; gap: 2px; padding: 12px 0; border-bottom: 1px solid #26201C">
          <div style="font-size: 16px; font-weight: 600; color: #D8CFC4">{{s.title}}</div>
          <div style="font-size: 14px; color: #A89F94">{{s.artist}}</div>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      songs: [
        { title: 'Fix You', artist: 'Coldplay' },
        { title: 'เพื่อนเล่นไม่เล่นเพื่อน', artist: 'Tilly Birds' },
        { title: 'ทางของฝุ่น', artist: 'Atom ชนกันต์' },
        { title: 'Yellow', artist: 'Coldplay' },
        { title: 'Perfect', artist: 'Ed Sheeran' },
        { title: 'วาฬเกยตื้น', artist: 'GUNGUN' },
        { title: 'ซ่อนกลิ่น', artist: 'Palmy' },
        { title: 'Shallow', artist: 'Lady Gaga, Bradley Cooper' },
        { title: 'ถ้าเราเจอกันอีก', artist: 'Tilly Birds' }
      ]
    };
  }
}
</script>
</body>
</html>
