<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>ส่งคำขอเพลง</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#F5B544}a:hover{color:#FFD27F}
input::placeholder,textarea::placeholder{color:#8A8178}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #14110F; color: #F4EFE8; font-family: 'IBM Plex Sans Thai', system-ui, sans-serif">
  <div style="height: 844px; overflow-y: auto; padding: 16px 20px 130px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px">

    <div style="display: flex; align-items: center; gap: 8px">
      <a href="Main.dc.html" aria-label="กลับไปเลือกเพลง" style="width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #1F1B18; border: 1px solid #2E2723">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F4EFE8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
      </a>
      <h1 style="margin: 0; font-size: 22px; font-weight: 700">ส่งคำขอเพลง</h1>
    </div>

    <section style="display: flex; flex-direction: column; gap: 6px">
      <h2 style="margin: 0 0 4px; font-size: 14px; font-weight: 600; color: #A89F94">เพลงที่เลือก (2)</h2>
      <div style="display: flex; align-items: center; gap: 12px; background: #1F1B18; border: 1px solid #2E2723; border-radius: 14px; padding: 10px 6px 10px 16px">
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 16px; font-weight: 600">ทางของฝุ่น</div>
          <div style="font-size: 14px; color: #A89F94">Atom ชนกันต์</div>
        </div>
        <button aria-label="เอาออก: ทางของฝุ่น" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A89F94" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; background: #1F1B18; border: 1px solid #2E2723; border-radius: 14px; padding: 10px 6px 10px 16px">
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 16px; font-weight: 600">Perfect</div>
          <div style="font-size: 14px; color: #A89F94">Ed Sheeran</div>
        </div>
        <button aria-label="เอาออก: Perfect" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A89F94" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 14px">
      <label style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 14px; color: #D8CFC4">ชื่อหรือเลขโต๊ะ <span style="color: #8A8178">(ไม่บังคับ)</span></span>
        <input type="text" placeholder="เช่น โต๊ะ 7 หรือ มิ้น" style="height: 48px; padding: 0 14px; border-radius: 14px; background: #1F1B18; border: 1px solid #2E2723; color: #F4EFE8; font: inherit; font-size: 16px; outline: none">
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 14px; color: #D8CFC4">ข้อความถึงนักดนตรี <span style="color: #8A8178">(ไม่บังคับ)</span></span>
        <textarea rows="2" placeholder="เช่น ขอเพลงนี้ให้แฟนวันเกิดค่ะ" style="padding: 12px 14px; border-radius: 14px; background: #1F1B18; border: 1px solid #2E2723; color: #F4EFE8; font: inherit; font-size: 16px; resize: none; outline: none"></textarea>
        <span style="align-self: flex-end; font-size: 12px; color: #8A8178">0 / 140</span>
      </label>
    </section>

    <section style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 17px; font-weight: 700">ให้ทิปนักดนตรี</h2>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{tips}}" as="t" hint-placeholder-count="6">
          <button onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="{{t.style}}">{{t.label}}</button>
        </sc-for>
      </div>
      <p style="margin: 0; font-size: 13px; color: #A89F94; line-height: 1.5">โอนผ่านพร้อมเพย์เข้าบัญชีนักดนตรีโดยตรง 100% ไม่มีค่าธรรมเนียม</p>
    </section>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 20px 30px; background: #1B1714; border-top: 1px solid #2E2723">
    <a href="{{nextHref}}" style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 14px; background: #F5B544; color: #1A1408; font-size: 17px; font-weight: 700; text-decoration: none">{{cta}}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tip: 50 };
  }
  renderVals() {
    const opts = [
      { v: 0, label: 'ไม่ให้ทิป' },
      { v: 20, label: '฿20' },
      { v: 50, label: '฿50' },
      { v: 100, label: '฿100' },
      { v: 200, label: '฿200' },
      { v: -1, label: 'ใส่เอง' }
    ];
    const base = 'height: 48px; border-radius: 999px; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer; ';
    const on = base + 'background: #F5B544; color: #1A1408; border: 1px solid #F5B544';
    const off = base + 'background: #1F1B18; color: #F4EFE8; border: 1px solid #3A322C';
    const tip = this.state.tip;
    const tips = opts.map((o) => ({
      label: o.label,
      on: tip === o.v,
      style: tip === o.v ? on : off,
      pick: () => this.setState({ tip: o.v })
    }));
    return {
      tips,
      cta: tip > 0 ? 'ส่งคำขอ และโอนทิป ฿' + tip : (tip === -1 ? 'ส่งคำขอ และใส่ยอดทิป' : 'ส่งคำขอ (ไม่ให้ทิป)'),
      nextHref: tip === 0 ? 'Status.dc.html' : 'Pay.dc.html'
    };
  }
}
</script>
</body>
</html>
