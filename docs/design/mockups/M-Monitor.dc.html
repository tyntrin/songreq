<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>จอดูคำขอ คืนนี้</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#F5B544}a:hover{color:#FFD27F}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #14110F; color: #F4EFE8; font-family: 'IBM Plex Sans Thai', system-ui, sans-serif">
  <div style="height: 844px; overflow-y: auto; padding: 18px 16px 110px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">

    <div style="display: flex; align-items: center; gap: 10px">
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <h1 style="margin: 0; font-size: 22px; font-weight: 700">คำขอคืนนี้</h1>
        <div style="font-size: 13px; color: #A89F94">ศ. 20 พ.ย. · จอเปิดค้างไว้</div>
      </div>
      <button onClick="{{toggleSound}}" aria-label="{{soundLabel}}" aria-pressed="{{soundOn}}" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #3A322C; background: #1F1B18; display: flex; align-items: center; justify-content: center">
        <sc-if value="{{soundOn}}" hint-placeholder-val="{{ true }}">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F5B544" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4V5z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"></path></svg>
        </sc-if>
        <sc-if value="{{soundOff}}" hint-placeholder-val="{{ false }}">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A89F94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4V5z"></path><path d="M22 9l-6 6M16 9l6 6"></path></svg>
        </sc-if>
      </button>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <div style="background: #1F1B18; border: 1px solid #2E2723; border-radius: 14px; padding: 12px 14px">
        <div style="font-size: 13px; color: #A89F94">คำขอ</div>
        <div style="font-size: 28px; font-weight: 700; line-height: 1.2">12</div>
      </div>
      <div style="background: #1F1B18; border: 1px solid #2E2723; border-radius: 14px; padding: 12px 14px">
        <div style="font-size: 13px; color: #A89F94">ทิปที่ลูกค้าแจ้ง</div>
        <div style="font-size: 28px; font-weight: 700; line-height: 1.2; color: #F5B544">฿350</div>
      </div>
    </div>

    <div style="display: flex; gap: 8px; overflow-x: auto">
      <button style="flex-shrink: 0; background: #F5B544; color: #1A1408; border: 0; border-radius: 999px; padding: 0 14px; height: 36px; font: inherit; font-size: 14px; font-weight: 600">ทุก QR</button>
      <button style="flex-shrink: 0; background: #1F1B18; color: #E4DCD2; border: 1px solid #2E2723; border-radius: 999px; padding: 0 14px; height: 36px; font: inherit; font-size: 14px">The Porch</button>
      <button style="flex-shrink: 0; background: #1F1B18; color: #E4DCD2; border: 1px solid #2E2723; border-radius: 999px; padding: 0 14px; height: 36px; font: inherit; font-size: 14px">งานแต่ง</button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{reqs}}" as="r" hint-placeholder-count="5">
        <article style="{{r.cardStyle}}">
          <div style="display: flex; align-items: flex-start; gap: 10px">
            <div style="flex: 1; min-width: 0">
              <div style="font-size: 20px; font-weight: 700; line-height: 1.25">{{r.title}}</div>
              <div style="font-size: 15px; color: #A89F94">{{r.artist}}</div>
            </div>
            <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px">
              <sc-if value="{{r.isNew}}" hint-placeholder-val="{{ false }}">
                <span style="background: #F5B544; color: #1A1408; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 700">ใหม่</span>
              </sc-if>
              <sc-if value="{{r.multi}}" hint-placeholder-val="{{ false }}">
                <span style="background: #2B2218; color: #F5B544; border-radius: 999px; padding: 2px 10px; font-size: 13px; font-weight: 700">ขอ {{r.times}} ครั้ง</span>
              </sc-if>
            </div>
          </div>
          <sc-if value="{{r.hasMsg}}" hint-placeholder-val="{{ false }}">
            <div style="font-size: 15px; line-height: 1.5; color: #E9DFD3; background: #26211D; border-radius: 10px; padding: 8px 12px">"{{r.msg}}"</div>
          </sc-if>
          <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: #A89F94">
            <span>{{r.who}}</span>
            <span aria-hidden="true">·</span>
            <span>{{r.when}}</span>
            <sc-if value="{{r.hasTip}}" hint-placeholder-val="{{ false }}">
              <span style="margin-left: auto; color: #F5B544; font-weight: 600">ทิป ฿{{r.tip}} (แจ้งโอน)</span>
            </sc-if>
          </div>
        </article>
      </sc-for>
    </div>
  </div>

  <nav aria-label="เมนูหลัก" style="position: absolute; left: 0; right: 0; bottom: 0; height: 82px; padding: 8px 8px 22px; box-sizing: border-box; background: #1B1714; border-top: 1px solid #2E2723; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr))">
    <a href="M-Monitor.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #F5B544; font-size: 12px; font-weight: 600">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F5B544" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
      คำขอ
    </a>
    <a href="M-Songs.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #A89F94; font-size: 12px">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#A89F94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg>
      เพลง
    </a>
    <a href="M-Setlists.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #A89F94; font-size: 12px">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#A89F94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 17h4v4"></path></svg>
      QR
    </a>
    <a href="M-Stats.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #A89F94; font-size: 12px">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#A89F94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>
      สถิติ
    </a>
    <a href="M-Settings.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #A89F94; font-size: 12px">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#A89F94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg>
      ตั้งค่า
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sound: true };
  }
  renderVals() {
    const list = [
      { title: 'ทางของฝุ่น', artist: 'Atom ชนกันต์', who: 'โต๊ะ 7 · มิ้น', when: 'เมื่อกี้', tip: 50, times: 1, msg: 'ขอเพลงนี้ให้แฟนวันเกิดค่ะ', isNew: true },
      { title: 'Perfect', artist: 'Ed Sheeran', who: 'โต๊ะ 7 · มิ้น', when: 'เมื่อกี้', tip: 0, times: 1, msg: '', isNew: true },
      { title: 'วาฬเกยตื้น', artist: 'GUNGUN', who: 'โต๊ะ 3 และอีก 2 คน', when: '8 นาทีก่อน', tip: 100, times: 3, msg: '', isNew: false },
      { title: 'Shallow', artist: 'Lady Gaga, Bradley Cooper', who: 'ไม่ระบุชื่อ', when: '15 นาทีก่อน', tip: 0, times: 1, msg: 'ร้องคู่ได้ไหมคะ', isNew: false },
      { title: 'Fix You', artist: 'Coldplay', who: 'โต๊ะ 12 · เจมส์', when: '22 นาทีก่อน', tip: 200, times: 1, msg: '', isNew: false }
    ];
    const newCard = 'display: flex; flex-direction: column; gap: 10px; background: #221B14; border: 1px solid #F5B544; border-radius: 16px; padding: 14px 16px';
    const oldCard = 'display: flex; flex-direction: column; gap: 10px; background: #1F1B18; border: 1px solid #2E2723; border-radius: 16px; padding: 14px 16px';
    const reqs = list.map((r) => ({
      ...r,
      cardStyle: r.isNew ? newCard : oldCard,
      multi: r.times > 1,
      hasMsg: !!r.msg,
      hasTip: r.tip > 0
    }));
    const soundOn = this.state.sound;
    return {
      reqs,
      soundOn,
      soundOff: !soundOn,
      soundLabel: soundOn ? 'ปิดเสียงแจ้งเตือน' : 'เปิดเสียงแจ้งเตือน',
      toggleSound: () => this.setState({ sound: !this.state.sound })
    };
  }
}
</script>
</body>
</html>
