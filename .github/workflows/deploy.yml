name: Deploy

# Manual only. Builds on the runner (never on the 1 GB VM), uploads the tarball,
# runs /opt/songreq/deploy.sh on the VM (migrate, switch symlink, pm2 reload,
# health check, auto-rollback).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to deploy"
        required: false
        default: main

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Package release
        run: bash deploy/package.sh release.tgz

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 10 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Upload and deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          SSH_OPTS="-i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          scp $SSH_OPTS release.tgz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/release.tgz"
          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "sudo bash /opt/songreq/deploy.sh /tmp/release.tgz"

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
