name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # npm may print an "allow-scripts" warning for esbuild's postinstall; it is
      # only a warning (esbuild ships its binary via optional deps) and the install succeeds.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Check the deploy package can be assembled
        run: bash deploy/package.sh "$RUNNER_TEMP/release.tgz"
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      # playwright.config.ts starts `npm run dev` on :3200 with PGlite (no Postgres needed)
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
